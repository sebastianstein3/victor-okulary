name: Build V.I.C.T.O.R.

on:
  push:
    branches:
      - claude/jarvis-ai-glasses-project-zxsabo
      # Gałąź bieżącej sesji. Bez niej push nie uruchamia niczego, a CI jest
      # JEDYNYM prawdziwym buildem tego projektu - lokalny kompilator w
      # środowisku agenta nie rozwiąże AndroidX ani Compose.
      - claude/repo-exploration-jj1wsm
  workflow_dispatch:

# JEDEN BIEG NA GAŁĄŹ - starsze są przerywane.
#
# Bez tego dwa pchnięcia pod rząd dają dwa równoległe biegi, a wydanie
# `build-latest` dostaje APK od tego, który skończy PÓŹNIEJ - niekoniecznie od
# nowszego commita. Tak się właśnie stało: bieg 94 (5f78a7b, start 10:44,
# koniec 10:55) nadpisał bieg 95 (ed1b48e, start 10:45, koniec 10:54). Osoba
# testująca pobrała wtedy starszą wersję niż ta, o której jej powiedziano.
#
# `cancel-in-progress` załatwia przy okazji drugą rzecz: przestajemy płacić za
# minuty budowania czegoś, co i tak zaraz przestanie być aktualne. Przy limicie
# rozliczeniowym konta to nie jest drobiazg.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    # `actions: write` wyłącznie po to, żeby dało się kasować własne artefakty -
    # patrz krok sprzątania niżej. `contents: write` po to, żeby dało się wrzucić
    # APK do wydania - patrz krok "APK do wydania".
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SPRZĄTANIE PRZED BUDOWANIEM, NIE PO.
      #
      # Debugowy APK tego projektu waży 113,7 MB (zmierzone), a darmowe konto ma
      # 500 MB na artefakty - czyli mieszczą się CZTERY. Przy domyślnym
      # przechowywaniu 90 dni miejsce skończyło się po jednym dniu pracy, a
      # wtedy GitHub przestaje przyjmować kolejne wysyłki i build kończy się bez
      # pliku do zainstalowania.
      #
      # Krok stoi PRZED kompilacją z rozmysłu: gdyby sprzątał po wysyłce, to
      # właśnie ta wysyłka odbijałaby się od pełnego limitu. Tu zwalnia miejsce,
      # zanim będzie potrzebne - i robi to nawet wtedy, gdy build się wywróci.
      #
      # Zostaje ZAWSZE najnowszy APK: ten z bieżącego przebiegu jeszcze nie
      # istnieje, więc kasujemy wszystkie wcześniejsze.
      - name: Zwolnij miejsce po starych APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NAZWY ZMIENNYCH PO ANGIELSKU - w bashu to nie jest wybór stylu.
          # Dopuszcza on w nazwach wyłącznie [A-Za-z0-9_], więc "usunięte=0"
          # nie jest przypisaniem, tylko nieznanym poleceniem: kod 127 i cztery
          # czerwone buildy z rzędu. W Kotlinie polskie nazwy są legalne i cały
          # ten projekt na nich stoi - tutaj nie.
          removed=0
          for id in $(gh api --paginate \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "victor-debug-apk") | select(.expired == false) | .id'); do
            # Artefakt wygasły albo już skasowany oddaje 404 - to nie jest błąd,
            # tylko stan, o który nam chodziło.
            if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" 2>/dev/null; then
              removed=$((removed + 1))
            fi
          done
          echo "Skasowane stare APK: $removed"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runnery ubuntu-latest mają Android SDK preinstalowany,
      # a ANDROID_HOME jest ustawione - local.properties nie jest potrzebne.
      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version

      # -Pvictor.abi.arm64=true: APK tylko pod arm64-v8a. Uzasadnienie i dlaczego
      # to jest właściwość, a nie stała w build.gradle.kts - w komentarzu przy
      # `tylkoArm64` w jarvis-app/app/build.gradle.kts. W skrócie: ten plik idzie
      # na TELEFONY osób testujących (wszystkie arm64), a test dymny buduje
      # osobno i BEZ tej właściwości, bo emulator jest x86_64.
      - name: Build debug APK
        working-directory: jarvis-app
        run: |
          set -o pipefail
          ./gradlew assembleDebug -Pvictor.abi.arm64=true --no-daemon --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      # Rozmiar ORAZ skład w logu. Rozmiar sam w sobie nie mówi, co ciąć -
      # obcięcie architektur do samego arm64 dało 113,7 -> 106 MB, czyli osiem
      # razy mniej, niż zakładałem. Ta lista pokazuje, gdzie te megabajty
      # naprawdę siedzą, zamiast kolejnej zgadywanki.
      - name: Rozmiar i skład APK
        run: |
          apk=$(ls jarvis-app/app/build/outputs/apk/debug/*.apk | head -1)
          du -h "$apk"
          echo "======== NAJWIĘKSZE KATALOGI W APK (rozmiar przed kompresją) ========"
          unzip -l "$apk" \
            | awk '$2 ~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ && $4 !~ /\/$/ {
                     n = split($4, p, "/");
                     key = (n > 2 ? p[1] "/" p[2] : (n > 1 ? p[1] : "(korzeń)"));
                     sum[key] += $1
                   }
                   END { for (k in sum) printf "%8.1f MB  %s\n", sum[k] / 1048576, k }' \
            | sort -rn | head -25
          echo "======== NAJWIĘKSZE POJEDYNCZE PLIKI ========"
          unzip -l "$apk" \
            | awk '$2 ~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ && $1 > 1048576 {
                     printf "%8.1f MB  %s\n", $1 / 1048576, $4
                   }' \
            | sort -rn | head -15

      # Bez tego log tonie w stack trace Gradle'a - tu zostaje sama treść błędów.
      - name: Podsumowanie błędów
        if: failure()
        run: |
          echo "======== BŁĘDY KOMPILACJI: $(grep -c '^e: ' build.log || echo 0) ========"
          # Skracamy ścieżki i zwijamy powtórzenia - inaczej log jest nieczytelny.
          grep -E "^e: " build.log \
            | sed 's|^e: file://.*/pl/victor/app/||' \
            | sort -u | head -120 || echo "(brak)"
          echo
          echo "======== BŁĘDY ZASOBÓW / MANIFESTU ========"
          grep -E "error:|Error:|AAPT|Manifest merger|More than one file|Duplicate|files found with path|Entry name" build.log \
            | sort -u | head -30 || echo "(brak)"
          echo
          echo "======== NIEUDANE ZADANIA ========"
          grep -E "> Task .* FAILED|What went wrong|Execution failed|Could not find|Could not resolve" build.log | head -20 || echo "(brak)"
          echo
          echo "======== STACK TRACE (Caused by / wyjątki) ========"
          grep -E "^Caused by:|Exception|Error:.*$|^\s+at [a-zA-Z]" build.log \
            | sort -u | head -60 || echo "(brak)"

      # continue-on-error NIE jest zamiataniem awarii pod dywan - jest naprawą
      # gorszej awarii. Dopóki ten krok potrafił wywrócić zadanie, zapchana
      # kwota artefaktów kasowała NASTĘPNE kroki: testy jednostkowe (`if:
      # success()`) i cały test dymny na emulatorze (`needs: build`). Przez
      # ostatnie biegi CI mówiło więc wyłącznie "kompiluje się", choć testy
      # istnieją i przechodziły. Kwota to problem z kontem GitHuba, nie sygnał o
      # kodzie, i nie ma prawa wyłączać sygnałów o kodzie.
      #
      # Niepowodzenie nie znika po cichu: następny krok wypisuje ostrzeżenie,
      # widoczne w podsumowaniu biegu.
      - name: Upload APK
        id: upload-apk
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: victor-debug-apk
          path: jarvis-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          # Trzy dni, nie domyślne dziewięćdziesiąt. APK do testu jest potrzebny
          # tego samego dnia, a każdy kolejny tydzień leżenia zjada limit konta.
          retention-days: 3

      - name: APK nie został wysłany
        if: steps.upload-apk.outcome == 'failure'
        run: |
          echo "::warning title=APK niedostępny::Kompilacja przeszła, ale nie udało się wysłać APK - najczęściej zapchana kwota artefaktów konta (GitHub przelicza zużycie co 6-12 godzin). Testy jednostkowe i test dymny idą dalej."

      - name: Run unit tests
        if: success()
        working-directory: jarvis-app
        run: ./gradlew testDebugUnitTest --no-daemon

      # Ta sama kwota, ta sama naprawa co przy APK wyżej - i ten sam powód.
      # W biegu 75 testy jednostkowe WRESZCIE się uruchomiły i przeszły, po czym
      # wysyłka ich raportu padła na kwocie i znów wywróciła zadanie, przez co
      # test dymny na emulatorze znów został pominięty. Raport to wygoda przy
      # czytaniu wyniku, nie sam wynik; wynik stoi w kroku "Run unit tests".
      - name: Upload unit test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: jarvis-app/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      # APK DO WYDANIA - obejście kwoty artefaktów, nie ozdobnik.
      #
      # Pliki dołączone do wydania idą do INNEJ puli miejsca niż artefakty
      # Actions, więc działają wtedy, gdy wysyłka artefaktu pada na kwocie -
      # a padała przez kilkanaście biegów z rzędu, mimo że po sprzątaniu to
      # repozytorium trzyma 8,3 MB i ani jednego APK.
      #
      # Przy okazji naprawia dwie rzeczy, które i tak doskwierały osobom
      # testującym: link nie wygasa po trzech dniach i nie trzeba grzebać w
      # zakładce Actions ani nawet mieć konta - wystarczy zwykły adres.
      #
      # PO TESTACH, nie przed. Dwa powody, oba z dzisiejszych biegów:
      #
      # 1. Ten krok NIE ma `continue-on-error` - jeśli wrzucenie APK się nie
      #    uda, zadanie ma być czerwone, bo to jest teraz jedyna droga pliku do
      #    osób testujących. Ale krok, który potrafi wywrócić zadanie, nie może
      #    stać przed testami: dokładnie tak zapchana kwota artefaktów kasowała
      #    testy jednostkowe i cały test dymny przez kilkanaście biegów.
      # 2. Build z czerwonymi testami nie ma trafiać do osób testujących.
      #    `if: success()` załatwia to samo przez to, że stoi tutaj.
      #
      # JEDNO wydanie, nadpisywane przy każdym buildzie (`--clobber`), zamiast
      # nowego taga przy każdym commicie. Osoby testujące dostają wtedy jeden
      # stały link, który zawsze wskazuje najnowszą wersję, a repozytorium nie
      # zapełnia się tagami. Jest oznaczone jako `--prerelease`, bo to jest
      # build debugowy, a nie wydanie.
      #
      # `|| true` przy `create`: wydanie istnieje po pierwszym biegu, więc od
      # drugiego to polecenie ma prawo zawieść i nie jest to błąd. Samo
      # `upload` błędu już nie wybacza.
      - name: APK do wydania
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls jarvis-app/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" victor-debug.apk
          gh release create build-latest \
            --title "V.I.C.T.O.R. - build testowy" \
            --prerelease \
            --target "${{ github.sha }}" \
            --notes "Najnowszy build do testów. Ten adres zawsze wskazuje ostatnią wersję." \
            || true
          gh release upload build-latest victor-debug.apk --clobber
          gh release edit build-latest \
            --notes "Najnowszy build do testów - ten adres zawsze wskazuje ostatnią wersję.

          Commit: ${{ github.sha }}
          Gałąź: ${{ github.ref_name }}
          Zbudowano: $(date -u '+%Y-%m-%d %H:%M UTC')

          Instrukcja obsługi: docs/instrukcja-dla-osob-testujacych.docx"
          echo "APK w wydaniu: ${{ github.server_url }}/${{ github.repository }}/releases/tag/build-latest"


  # Test dymny na emulatorze: aplikacja ma się zainstalować, wstać i przejść
  # całą ścieżkę komunikacji z okularami na symulatorze. To jedyne miejsce,
  # w którym kod BLE, Compose i szyfrowane preferencje spotykają prawdziwy
  # runtime Androida przed sprzętem.
  emulator:
    name: Test dymny na emulatorze
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Emulator z KVM startuje kilka razy szybciej niż programowy.
      - name: Włącz KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Obraz systemu emulatora rozpakowuje się na dysk runnera, a ten przychodzi
      # zapchany oprogramowaniem, którego ten workflow nie używa. Bieg
      # 93732312298 padł DWA RAZY na "No space left on device": emulator nie
      # wystartował w ogóle, więc nie powstał żaden raport XML i podsumowanie
      # nieudanych testów wyszło PUSTE. Z zewnątrz wyglądało to jak regresja w
      # kodzie, której nie było - a to jest najgorszy rodzaj czerwonego biegu,
      # bo wysyła na poszukiwanie nieistniejącej usterki.
      #
      # Największy pojedynczy zysk to NDK (kilka GB). Projekt nie ma kodu
      # natywnego - vendor SDK okularów jest zwykłym AAR-em - więc NDK nie jest
      # tu do niczego potrzebne. `df -h` po obu stronach zostaje celowo: gdy to
      # kiedyś znowu nie wystarczy, log od razu pokaże, ile brakowało.
      - name: Zwolnij miejsce na dysku
        run: |
          echo "--- przed sprzątaniem ---"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android/sdk/ndk \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "--- po sprzątaniu ---"
          df -h /

      - name: Cache obrazu AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-aosp-atd

      # Emulator na współdzielonym runnerze potrafi paść PRZED pierwszym testem:
      # nieudane wczytanie snapshotu, martwy system server (DeadSystemException),
      # "adb: device offline". To nie jest usterka kodu i nie da się jej naprawić
      # w aplikacji, a czerwony bieg z takiego powodu kosztuje uwagę tak samo jak
      # prawdziwy. Stąd JEDNA powtórka - na świeżym AVD, bez podejrzanego
      # snapshotu. Prawdziwie nieudany test padnie w niej tak samo, więc to nie
      # jest zamiatanie awarii pod dywan; ukrywa wyłącznie flaka startu maszyny.
      - name: Uruchom testy instrumentacyjne
        id: emulator-run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: jarvis-app
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Powtórka na świeżym emulatorze
        if: steps.emulator-run.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: jarvis-app
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Podsumowanie błędów testów
        if: failure()
        run: |
          echo "======== NIEUDANE TESTY ========"
          find jarvis-app/app/build/reports/androidTests -name "*.html" -print 2>/dev/null | head
          # -print0/-0: nazwy raportów zawierają spacje ("TEST-emulator-5554 - 11...").
          find jarvis-app/app/build/outputs/androidTest-results -name "*.xml" -print0 2>/dev/null \
            | xargs -0 -r grep -h -A 4 "<failure" | head -80 || echo "(brak raportu XML)"

      # Jak wyżej: raport z testu dymnego nie może decydować o tym, czy test
      # dymny wypadł zielono.
      - name: Upload raportu testów instrumentacyjnych
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            jarvis-app/app/build/reports/androidTests
            jarvis-app/app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 7
