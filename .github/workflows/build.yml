name: Build V.I.C.T.O.R.

on:
  push:
    branches:
      - claude/jarvis-ai-glasses-project-zxsabo
      # Gałąź bieżącej sesji. Bez niej push nie uruchamia niczego, a CI jest
      # JEDYNYM prawdziwym buildem tego projektu - lokalny kompilator w
      # środowisku agenta nie rozwiąże AndroidX ani Compose.
      - claude/repo-exploration-jj1wsm
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    # `actions: write` wyłącznie po to, żeby dało się kasować własne artefakty -
    # patrz krok sprzątania niżej. Reszta zostaje na odczycie.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SPRZĄTANIE PRZED BUDOWANIEM, NIE PO.
      #
      # Debugowy APK tego projektu waży 113,7 MB (zmierzone), a darmowe konto ma
      # 500 MB na artefakty - czyli mieszczą się CZTERY. Przy domyślnym
      # przechowywaniu 90 dni miejsce skończyło się po jednym dniu pracy, a
      # wtedy GitHub przestaje przyjmować kolejne wysyłki i build kończy się bez
      # pliku do zainstalowania.
      #
      # Krok stoi PRZED kompilacją z rozmysłu: gdyby sprzątał po wysyłce, to
      # właśnie ta wysyłka odbijałaby się od pełnego limitu. Tu zwalnia miejsce,
      # zanim będzie potrzebne - i robi to nawet wtedy, gdy build się wywróci.
      #
      # Zostaje ZAWSZE najnowszy APK: ten z bieżącego przebiegu jeszcze nie
      # istnieje, więc kasujemy wszystkie wcześniejsze.
      - name: Zwolnij miejsce po starych APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NAZWY ZMIENNYCH PO ANGIELSKU - w bashu to nie jest wybór stylu.
          # Dopuszcza on w nazwach wyłącznie [A-Za-z0-9_], więc "usunięte=0"
          # nie jest przypisaniem, tylko nieznanym poleceniem: kod 127 i cztery
          # czerwone buildy z rzędu. W Kotlinie polskie nazwy są legalne i cały
          # ten projekt na nich stoi - tutaj nie.
          removed=0
          for id in $(gh api --paginate \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "victor-debug-apk") | select(.expired == false) | .id'); do
            # Artefakt wygasły albo już skasowany oddaje 404 - to nie jest błąd,
            # tylko stan, o który nam chodziło.
            if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" 2>/dev/null; then
              removed=$((removed + 1))
            fi
          done
          echo "Skasowane stare APK: $removed"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runnery ubuntu-latest mają Android SDK preinstalowany,
      # a ANDROID_HOME jest ustawione - local.properties nie jest potrzebne.
      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version

      - name: Build debug APK
        working-directory: jarvis-app
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Bez tego log tonie w stack trace Gradle'a - tu zostaje sama treść błędów.
      - name: Podsumowanie błędów
        if: failure()
        run: |
          echo "======== BŁĘDY KOMPILACJI: $(grep -c '^e: ' build.log || echo 0) ========"
          # Skracamy ścieżki i zwijamy powtórzenia - inaczej log jest nieczytelny.
          grep -E "^e: " build.log \
            | sed 's|^e: file://.*/pl/victor/app/||' \
            | sort -u | head -120 || echo "(brak)"
          echo
          echo "======== BŁĘDY ZASOBÓW / MANIFESTU ========"
          grep -E "error:|Error:|AAPT|Manifest merger|More than one file|Duplicate|files found with path|Entry name" build.log \
            | sort -u | head -30 || echo "(brak)"
          echo
          echo "======== NIEUDANE ZADANIA ========"
          grep -E "> Task .* FAILED|What went wrong|Execution failed|Could not find|Could not resolve" build.log | head -20 || echo "(brak)"
          echo
          echo "======== STACK TRACE (Caused by / wyjątki) ========"
          grep -E "^Caused by:|Exception|Error:.*$|^\s+at [a-zA-Z]" build.log \
            | sort -u | head -60 || echo "(brak)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: victor-debug-apk
          path: jarvis-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          # Trzy dni, nie domyślne dziewięćdziesiąt. APK do testu jest potrzebny
          # tego samego dnia, a przy 113,7 MB każdy kolejny tydzień leżenia to
          # jedna piąta całego limitu konta.
          retention-days: 3

      - name: Run unit tests
        if: success()
        working-directory: jarvis-app
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: jarvis-app/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  # Test dymny na emulatorze: aplikacja ma się zainstalować, wstać i przejść
  # całą ścieżkę komunikacji z okularami na symulatorze. To jedyne miejsce,
  # w którym kod BLE, Compose i szyfrowane preferencje spotykają prawdziwy
  # runtime Androida przed sprzętem.
  emulator:
    name: Test dymny na emulatorze
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Emulator z KVM startuje kilka razy szybciej niż programowy.
      - name: Włącz KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Obraz systemu emulatora rozpakowuje się na dysk runnera, a ten przychodzi
      # zapchany oprogramowaniem, którego ten workflow nie używa. Bieg
      # 93732312298 padł DWA RAZY na "No space left on device": emulator nie
      # wystartował w ogóle, więc nie powstał żaden raport XML i podsumowanie
      # nieudanych testów wyszło PUSTE. Z zewnątrz wyglądało to jak regresja w
      # kodzie, której nie było - a to jest najgorszy rodzaj czerwonego biegu,
      # bo wysyła na poszukiwanie nieistniejącej usterki.
      #
      # Największy pojedynczy zysk to NDK (kilka GB). Projekt nie ma kodu
      # natywnego - vendor SDK okularów jest zwykłym AAR-em - więc NDK nie jest
      # tu do niczego potrzebne. `df -h` po obu stronach zostaje celowo: gdy to
      # kiedyś znowu nie wystarczy, log od razu pokaże, ile brakowało.
      - name: Zwolnij miejsce na dysku
        run: |
          echo "--- przed sprzątaniem ---"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android/sdk/ndk \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "--- po sprzątaniu ---"
          df -h /

      - name: Cache obrazu AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-aosp-atd

      # Emulator na współdzielonym runnerze potrafi paść PRZED pierwszym testem:
      # nieudane wczytanie snapshotu, martwy system server (DeadSystemException),
      # "adb: device offline". To nie jest usterka kodu i nie da się jej naprawić
      # w aplikacji, a czerwony bieg z takiego powodu kosztuje uwagę tak samo jak
      # prawdziwy. Stąd JEDNA powtórka - na świeżym AVD, bez podejrzanego
      # snapshotu. Prawdziwie nieudany test padnie w niej tak samo, więc to nie
      # jest zamiatanie awarii pod dywan; ukrywa wyłącznie flaka startu maszyny.
      - name: Uruchom testy instrumentacyjne
        id: emulator-run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: jarvis-app
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Powtórka na świeżym emulatorze
        if: steps.emulator-run.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: jarvis-app
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Podsumowanie błędów testów
        if: failure()
        run: |
          echo "======== NIEUDANE TESTY ========"
          find jarvis-app/app/build/reports/androidTests -name "*.html" -print 2>/dev/null | head
          # -print0/-0: nazwy raportów zawierają spacje ("TEST-emulator-5554 - 11...").
          find jarvis-app/app/build/outputs/androidTest-results -name "*.xml" -print0 2>/dev/null \
            | xargs -0 -r grep -h -A 4 "<failure" | head -80 || echo "(brak raportu XML)"

      - name: Upload raportu testów instrumentacyjnych
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            jarvis-app/app/build/reports/androidTests
            jarvis-app/app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 7
