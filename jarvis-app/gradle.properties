# Project-wide Gradle settings.

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# Build performance
# 3072m, nie 2048m: przy ówczesnym modelu lokalnym (siedem wariantów .so
# llama.cpp, dziś usunięty) kaptDebugKotlin padał bez czytelnego wyjątku -
# objaw zabicia workera przez brak pamięci. Bez llama.cpp zapotrzebowanie
# spadło, ale limit zostaje: runner CI ma pamięci w bród, a jego obniżenie
# niczego nie przyspiesza, za to może wskrzesić ten sam cichy błąd.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Android build
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false
